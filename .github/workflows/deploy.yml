name: Build & deploy site

# Builds the Astro site and deploys it to GitHub Pages.
# NOTE: this workflow only BUILDS the site from the committed tree.
# It does NOT fetch external sources — fetching, curation, and page generation
# run locally (/ai-daily and /ai-weekly skills) and the results are committed.
# CI stays fast, deterministic, and polite.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
