<title>AI Daily — candidate review</title>
<style>
  :root {
    --bg: #f7f7fa; --card: #ffffff; --text: #1a1a24; --muted: #6b6b7b;
    --border: #e3e3ea; --accent: #5b4bd5; --accent-soft: #eeecfb;
    --paper: #4338ca; --paper-bg: #eef2ff; --release: #047857; --release-bg: #ecfdf5;
    --community: #b45309; --community-bg: #fffbeb; --press: #0369a1; --press-bg: #f0f9ff;
    --social: #be185d; --social-bg: #fdf2f8;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #14141c; --card: #1d1d28; --text: #ececf4; --muted: #9a9aac;
    --border: #30303e; --accent: #8d7ef2; --accent-soft: #2a2450;
    --paper: #a5b4fc; --paper-bg: #272a4a; --release: #6ee7b7; --release-bg: #143528;
    --community: #fcd34d; --community-bg: #3a2e14; --press: #7dd3fc; --press-bg: #12314a;
    --social: #f9a8d4; --social-bg: #451a30;
  } }
  :root[data-theme="light"] {
    --bg: #f7f7fa; --card: #ffffff; --text: #1a1a24; --muted: #6b6b7b;
    --border: #e3e3ea; --accent: #5b4bd5; --accent-soft: #eeecfb;
    --paper: #4338ca; --paper-bg: #eef2ff; --release: #047857; --release-bg: #ecfdf5;
    --community: #b45309; --community-bg: #fffbeb; --press: #0369a1; --press-bg: #f0f9ff;
    --social: #be185d; --social-bg: #fdf2f8;
  }
  :root[data-theme="dark"] {
    --bg: #14141c; --card: #1d1d28; --text: #ececf4; --muted: #9a9aac;
    --border: #30303e; --accent: #8d7ef2; --accent-soft: #2a2450;
    --paper: #a5b4fc; --paper-bg: #272a4a; --release: #6ee7b7; --release-bg: #143528;
    --community: #fcd34d; --community-bg: #3a2e14; --press: #7dd3fc; --press-bg: #12314a;
    --social: #f9a8d4; --social-bg: #451a30;
  }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 1.5rem; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  .sub { color: var(--muted); margin: 0 0 1rem; font-size: 0.9rem; }
  .hint { background: var(--accent-soft); color: var(--text); border: 1px solid var(--accent); border-radius: 0.6rem; padding: 0.7rem 1rem; font-size: 0.9rem; margin-bottom: 1.25rem; }
  .hint code { font-weight: 700; }
  .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .filters button { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 999px; padding: 0.3em 0.9em; font-size: 0.85rem; cursor: pointer; }
  .filters button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 0.8rem; padding: 1rem 1.1rem; margin-bottom: 0.9rem; display: grid; grid-template-columns: 3rem 1fr; gap: 0.9rem; }
  .num { font-size: 1.25rem; font-weight: 800; color: var(--accent); text-align: center; padding-top: 0.15rem; }
  .meta { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; font-size: 0.78rem; }
  .badge { font-weight: 700; padding: 0.25em 0.7em; border-radius: 999px; }
  .b-paper { color: var(--paper); background: var(--paper-bg); }
  .b-release { color: var(--release); background: var(--release-bg); }
  .b-community { color: var(--community); background: var(--community-bg); }
  .b-press { color: var(--press); background: var(--press-bg); }
  .b-social { color: var(--social); background: var(--social-bg); }
  .signals, .src { color: var(--muted); }
  .scorebar { flex: 0 0 90px; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .scorebar i { display: block; height: 100%; background: var(--accent); }
  .score-label { color: var(--muted); font-variant-numeric: tabular-nums; }
  .card h3 { margin: 0.35rem 0 0; font-size: 1.02rem; line-height: 1.35; }
  .card h3 a { color: var(--text); text-decoration: none; }
  .card h3 a:hover { color: var(--accent); text-decoration: underline; }
  .why { margin: 0.4rem 0 0; font-size: 0.88rem; color: var(--accent); font-weight: 500; }
  .summary { margin: 0.35rem 0 0; font-size: 0.88rem; color: var(--muted); }
  .section-h { margin: 1.6rem 0 0.8rem; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
</style>
<div class="wrap">
  <h1>AI Daily — candidate review</h1>
  <p class="sub" id="stats"></p>
  <div class="hint">This dashboard is read-only. <strong>Type your selection in the terminal</strong> —
    e.g. <code>1,3,7-9</code>, <code>top 10</code>, <code>all papers</code>, or <code>none</code>.</div>
  <div class="filters" id="filters"></div>
  <div id="cards"></div>
</div>
<script>
  const CANDIDATES = /*__CANDIDATES__*/[];
  const DATE = /*__DATE__*/"";
  const CATS = ['paper','release','community','press','social'];
  const CAT_LABEL = { paper:'Paper', release:'Release', community:'Community', press:'Press', social:'Social' };
  let filter = 'all';

  document.getElementById('stats').textContent =
    DATE + ' · ' + CANDIDATES.length + ' candidates, sorted by score';

  function signalText(s) {
    if (!s) return '';
    const parts = [];
    if (s.hnPoints != null) parts.push('▲ ' + s.hnPoints + ' HN');
    if (s.hfUpvotes != null) parts.push('▲ ' + s.hfUpvotes + ' HF');
    if (s.redditScore != null) parts.push('▲ ' + s.redditScore + ' Reddit');
    return parts.join(' · ');
  }

  function render() {
    const cards = document.getElementById('cards');
    cards.innerHTML = '';
    CANDIDATES.forEach((c, i) => {
      if (filter !== 'all' && c.category !== filter) return;
      const el = document.createElement('article');
      el.className = 'card';
      el.innerHTML =
        '<div class="num">' + (i + 1) + '</div>' +
        '<div>' +
          '<div class="meta">' +
            '<span class="badge b-' + c.category + '">' + (CAT_LABEL[c.category] || c.category) + '</span>' +
            '<span class="src">' + (c.source || '') + '</span>' +
            '<span class="scorebar"><i style="width:' + (c.score || 0) + '%"></i></span>' +
            '<span class="score-label">' + (c.score ?? '—') + '</span>' +
            '<span class="signals">' + signalText(c.signals) + '</span>' +
          '</div>' +
          '<h3><a href="' + c.url + '" target="_blank" rel="noopener">' + c.title + '</a></h3>' +
          (c.whyItMatters ? '<p class="why">' + c.whyItMatters + '</p>' : '') +
          (c.summary ? '<p class="summary">' + c.summary + '</p>' : '') +
        '</div>';
      cards.appendChild(el);
    });
  }

  const filters = document.getElementById('filters');
  ['all', ...CATS].forEach((cat) => {
    const count = cat === 'all' ? CANDIDATES.length : CANDIDATES.filter((c) => c.category === cat).length;
    if (cat !== 'all' && count === 0) return;
    const b = document.createElement('button');
    b.textContent = (cat === 'all' ? 'All' : CAT_LABEL[cat]) + ' (' + count + ')';
    b.onclick = () => { filter = cat; render();
      [...filters.children].forEach((x) => x.classList.toggle('active', x === b)); };
    if (cat === 'all') b.classList.add('active');
    filters.appendChild(b);
  });
  render();
</script>
